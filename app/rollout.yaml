apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: novabank-web
  namespace: novabank
  labels:
    app: novabank-web
    owner: novabank
spec:
  replicas: 2

  selector:
    matchLabels:
      app: novabank-web

  template:
    metadata:
      labels:
        app: novabank-web
        owner: novabank

    spec:
      containers:
      - name: novabank-web
        image: nginx:1.27
        ports:
        - containerPort: 80

  strategy:
    canary:
      steps:
      - setWeight: 20
      - pause:
          duration: 30s

      - setWeight: 50
      - pause:
          duration: 30s

      - setWeight: 100