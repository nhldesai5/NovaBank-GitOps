apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: novabank-bluegreen
  namespace: novabank
  labels:
    app: novabank-bluegreen
    owner: novabank
spec:
  replicas: 2

  selector:
    matchLabels:
      app: novabank-bluegreen

  template:
    metadata:
      labels:
        app: novabank-bluegreen
        owner: novabank

    spec:
      containers:
      - name: novabank-bluegreen
        image: nginx:1.28
        ports:
        - containerPort: 80

  strategy:
    blueGreen:
      activeService: novabank-active
      previewService: novabank-preview
      autoPromotionEnabled: false