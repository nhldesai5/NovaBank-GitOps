apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novabank-bluegreen
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nhldesai5/NovaBank-GitOps.git
    targetRevision: main
    path: bluegreen

  destination:
    server: https://kubernetes.default.svc
    namespace: novabank

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true