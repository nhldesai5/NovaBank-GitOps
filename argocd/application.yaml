apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novabank-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nhldesai5/NovaBank-GitOps.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: novabank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true